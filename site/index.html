<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoja de Pedido Kapazi</title>
<link rel="icon" href="favicon.png">
<script src="config.js?v=20261023g"></script>
<script src="logo.js?v=20261023g"></script>
<script src="traducao.js?v=20261023g"></script>
<script src="idiomas.js?v=20261023g"></script>
<style>
:root{--navy:#041243;--coral:#F16A64;--line:#d9dbe2;--muted:#6b7080;--bg:#f5f6f8;--card:#fff;--ok:#1e6b38;--sel:#eef3fb;--warn:#fff8dc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font:15px/1.4 "Segoe UI",Arial,sans-serif;color:#1d2030}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:14px}
header img{height:38px}
header h1{font-size:18px;margin:0;font-weight:600}
header .sub{font-size:12px;opacity:.75}
main{max-width:1100px;margin:0 auto;padding:16px 16px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
h2{font-size:16px;color:var(--navy);margin:0 0 4px}
.ayuda{font-size:13px;color:var(--muted);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 14px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
label b{color:var(--coral)}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:inherit}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #9db6da;border-color:#9db6da}
.falta{border-color:#c0392b;background:#fff4f3}
.busca{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.busca input{flex:1 1 260px;font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 11px;font-size:13px;cursor:pointer;color:inherit}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.lista{display:flex;flex-direction:column;gap:8px}
.prod{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}
.prod.sel{background:var(--sel);border-color:#9db6da}
.foto{width:76px;height:60px;border-radius:6px;background:#f0f1f4 center/contain no-repeat;cursor:zoom-in;display:flex;align-items:center;justify-content:center;font-size:11px;color:#aaa}
.foto img{max-width:100%;max-height:100%;border-radius:6px}
.cod{font-family:Consolas,Menlo,monospace;font-weight:700;color:var(--navy);font-size:14px}
.desc{font-size:14px}
.det{font-size:12px;color:var(--muted)}
.cant{display:flex;align-items:center;gap:4px}
.cant input{width:78px;text-align:right;font-size:16px;padding:7px}
.cant{flex-wrap:wrap;justify-content:flex-end}
.cant .conf{width:auto;height:36px;padding:0 12px;font-size:14px;background:var(--coral);border-color:var(--coral);color:#fff;font-weight:600;flex-basis:100%;max-width:260px;margin-left:auto}
.cant .conf.quitar{background:#fff;color:#a3271f;border-color:#f5c2bd}
.noped{flex-basis:100%;text-align:right;font-size:12px;color:var(--ok);font-weight:600}
.prod.pend{border-color:var(--coral);box-shadow:0 0 0 1px var(--coral) inset}
.cant button,.btn{border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font:inherit;color:inherit}
.cant button{width:34px;height:36px;font-size:18px;line-height:1}
.un{font-size:12px;color:var(--muted);min-width:52px}
.mas{margin:12px auto 0;display:block;padding:9px 18px}
.vacio{padding:24px;text-align:center;color:var(--muted)}
mark{background:#ffe49a;padding:0}
.barra{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(4,18,67,.08);padding:10px 16px}
.barra div{max-width:1100px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600;padding:11px 20px}
.btn.pri:disabled{opacity:.5;cursor:default}
.btn.sec{padding:9px 14px}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
#numeroOC{font-family:Consolas,Menlo,monospace;color:var(--navy)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600}
td.n{text-align:right}
td input{padding:6px 8px}
.x{border:0;background:none;color:#a3271f;font-size:18px;cursor:pointer}
dialog{border:0;border-radius:12px;padding:0;max-width:min(980px,96vw);width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(4,18,67,.45)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600;color:var(--navy)}
.db{padding:16px 18px;max-height:70vh;overflow:auto}
.df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#zoom .db{text-align:center}
#zoomI{display:block;max-width:100%;max-height:68vh;margin:0 auto}
.miniaturas{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.miniaturas img{width:64px;height:52px;object-fit:contain;border:2px solid var(--line);border-radius:6px;cursor:pointer;background:#f0f1f4}
.miniaturas img.on{border-color:var(--navy)}
.nfotos{font-size:11px;color:var(--muted);margin-top:2px}
header .lang{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px}
header .lang select{width:auto;padding:5px 8px;font-size:13px;border-radius:6px;border:0}
.tag{display:inline-block;font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle;font-family:"Segoe UI",Arial,sans-serif}
.tag.novo{background:#e3f4e8;color:var(--ok)}.tag.sai{background:#fff1d6;color:#9a5b00}
#aviso{display:none;background:#fdecea;color:#a3271f;border:1px solid #f5c2bd;border-radius:10px;padding:12px 14px;margin-bottom:16px}
.ok{background:#e8f5ec;border:1px solid #b9dfc6;color:var(--ok);border-radius:10px;padding:12px 14px;font-size:14px}
@media (max-width:600px){
  .prod{grid-template-columns:64px 1fr;}
  .foto{width:64px;height:52px}
  .cant{grid-column:1 / -1;justify-content:flex-end}
  header h1{font-size:16px}
  header{gap:10px}
  header img{height:30px}
  header .sub,header .lang span{display:none}
  main{padding-bottom:190px}
  .toast{bottom:200px;max-width:90vw;text-align:center}
  .barra .btn{padding:8px 12px;font-size:14px}
}
</style>
</head>
<body>
<header>
  <img id="logo" alt="Kapazi">
  <div><h1 data-t="titulo"></h1><div class="sub" data-t="sub"></div></div>
  <label class="lang"><span data-t="idioma"></span><select id="idioma"></select></label>
</header>
<main>
  <div id="aviso"></div>

  <section class="card">
    <h2 data-t="datos"></h2>
    <p class="ayuda" data-t="datosAyuda"></p>
    <p id="usarDatosBox" style="display:none;margin:0 0 14px"><button class="btn sec" id="usarDatos" type="button" data-t="usarDatos"></button></p>
    <div class="grid" id="datos"></div>
  </section>

  <section class="card">
    <h2 data-t="productos"></h2>
    <p class="ayuda" data-t="productosAyuda"></p>
    <div class="busca">
      <input id="q" type="search" autocomplete="off">
      <button class="btn sec" id="soloSel" type="button"></button>
      <label class="btn sec" style="margin:0;font-size:15px;color:inherit;cursor:pointer"><span data-t="subirHoja"></span><input type="file" id="hojaArquivo" accept=".xlsx,.xlsm,.xls,.ods,.csv,.txt,.tsv,.pdf" hidden></label>
    </div>
    <div class="chips" id="chips"></div>
    <div class="lista" id="lista"><div class="vacio" data-t="cargando"></div></div>
    <button class="btn sec mas" id="mas" type="button" style="display:none"></button>
  </section>
</main>

<div class="barra"><div>
  <span><span id="resumen"></span><br><span class="det"><span data-t="numero"></span>: <b id="numeroOC"></b></span></span>
  <span class="acoes">
    <button class="btn sec" id="btnLimpar" type="button" data-t="limpiarPed"></button>
    <button class="btn sec" id="btnPedidos" type="button" data-t="misPedidos"></button>
    <button class="btn sec" id="btnGuardar" type="button" data-t="guardarBtn"></button>
    <button class="btn pri" id="revisar" type="button" disabled data-t="revisar"></button>
  </span>
</div></div>

<dialog id="dlgPed">
  <div class="dh"><span data-t="pedTitulo"></span> <button class="btn sec" type="button" onclick="dlgPed.close()">✕</button></div>
  <div class="db">
    <p class="ayuda" data-t="pedAyuda"></p>
    <table><tbody id="pedTb"></tbody></table>
  </div>
  <div class="df">
    <label class="btn sec" style="margin:0;font-size:15px;color:inherit;cursor:pointer"><span data-t="abrirPdf"></span><input type="file" id="pedArquivo" accept=".pdf,application/pdf" hidden></label>
    <button class="btn pri" id="btnNovo" type="button" data-t="nuevoPed"></button>
  </div>
</dialog>

<dialog id="dlgRev">
  <div class="dh"><span data-t="revTitulo"></span> <button class="btn sec" type="button" onclick="dlgRev.close()">✕</button></div>
  <div class="db">
    <div id="revFaltan"></div>
    <table><thead><tr><th data-t="cod"></th><th data-t="desc"></th><th data-t="unidad"></th><th style="text-align:right" data-t="cant"></th><th data-t="obs"></th><th></th></tr></thead><tbody id="revTb"></tbody></table>
    <div style="margin-top:14px"><label for="obsGeneral" data-t="obsGen"></label><textarea id="obsGeneral"></textarea></div>
    <div id="revOk" style="margin-top:14px;display:none" class="ok"></div>
  </div>
  <div class="df">
    <button class="btn sec" type="button" onclick="dlgRev.close()" data-t="seguir"></button>
    <button class="btn sec" id="ver" type="button" data-t="visualizar"></button>
    <button class="btn sec" id="imprimir" type="button" data-t="imprimir"></button>
    <button class="btn pri" id="pdf" type="button" data-t="descargar"></button>
  </div>
</dialog>

<dialog id="dlgHoja">
  <div class="dh"><span data-t="hojaTitulo"></span> <button class="btn sec" type="button" onclick="dlgHoja.close()">✕</button></div>
  <div class="db">
    <p class="ayuda" id="hojaResumo"></p>
    <table><thead><tr><th data-t="cod"></th><th data-t="desc"></th><th style="text-align:right" data-t="cant"></th></tr></thead><tbody id="hojaTb"></tbody></table>
    <div id="hojaFalta" style="margin-top:14px"></div>
  </div>
  <div class="df">
    <button class="btn sec" type="button" onclick="dlgHoja.close()" data-t="cerrar"></button>
    <button class="btn pri" id="hojaOk" type="button" data-t="hojaAgregar"></button>
  </div>
</dialog>

<dialog id="dlgVer" style="max-width:min(1000px,96vw)">
  <div class="dh"><span data-t="visualizar"></span> <button class="btn sec" type="button" onclick="dlgVer.close()">✕</button></div>
  <iframe id="verPdf" title="PDF" style="display:block;width:100%;height:72vh;border:0;background:#525659"></iframe>
  <div class="df"><button class="btn sec" type="button" onclick="dlgVer.close()" data-t="cerrar"></button><button class="btn sec" type="button" id="verImprimir" data-t="imprimir"></button><button class="btn pri" type="button" id="verBaixar" data-t="descargar"></button></div>
</dialog>

<dialog id="zoom"><div class="dh"><span id="zoomT"></span><button class="btn sec" type="button" onclick="zoom.close()">✕</button></div><div class="db"><img id="zoomI" alt=""><div class="miniaturas" id="zoomM"></div></div></dialog>

<script>
"use strict";
/* Hoja de Pedido online (pública, sem login), em espanhol, português ou inglês. O cliente escolhe os produtos e
   baixa um PDF que o "Importar pedido do cliente" do gerador lê direto: marca KZ-PED, cabeçalho CÓDIGO (ou
   PRODUCT CODE) / CANTIDAD (QUANTIDADE, QUANTITY) e só as linhas com quantidade.
   Produtos: função catalogo_pedido() do Supabase do gerador (sem preços; reserva: catalogo.json) + os da
   tabela ATACADO que não estão no gerador (produtos_extra.json). Fotos: planilha SKUImagens (imagens.json). */
const URL_JSPDF = "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js";
const URL_XLSX = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
const URL_PDFJS = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js", URL_PDFJS_WORKER = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
const URL_AUTOTABLE = "https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js";
const CONTATO = "cassiano.pajewski@kapazi.com.br";
const MARCA = "KZ-PED v1";
// todos os campos são obrigatórios
const CAMPOS = [["empresa", true], ["codCliente", true], ["docFiscal", true], ["pais", true], ["ciudad", true], ["direccion", true], ["contacto", true], ["email", true, "email"],
  ["telefono", true], ["oc", true], ["incoterm", true, "select", ["", "FOB", "CFR", "CIF", "EXW", "FCA", "CPT", "CIP", "DAP", "DDP"]], ["destino", true]];
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const chave = s => String(s || "").toUpperCase().replace(/[\s.\-\/_]/g, "");
const fmtQ = n => String(Math.round((Number(n) || 0) * 1000) / 1000).replace(".", ",");
const lerNum = s => { const n = parseFloat(String(s || "").replace(/\s/g, "").replace(",", ".")); return isFinite(n) && n > 0 ? n : 0; };

let CAT = [], porCod = new Map(), filtro = "", soloSel = false, categoria = "", mostrar = 40;
const salvo = LS.get("kz_pedido_v1", {});
const datos = {};   // a página sempre abre com "Sus datos" em branco; os dados completos ficam guardados (kz_cliente_v1) e voltam pelo botão "Usar mis datos guardados"
let itens = salvo.itens || {};   // cod -> {qtd, obs}
const params = new URLSearchParams(location.search);
if(params.get("cliente")) datos.codCliente = params.get("cliente");
if(params.get("empresa")) datos.empresa = params.get("empresa");
const navegador = (navigator.language || "").slice(0, 2);
let idioma = IDIOMAS[params.get("lang")] ? params.get("lang") : IDIOMAS[salvo.idioma] ? salvo.idioma : navegador === "pt" ? "pt" : navegador === "en" ? "en" : "es";
const T = () => TXT[idioma];
let numero = salvo.numero || "";   // nº da ordem de compra, criado ao salvar ou gerar o PDF
const completos = () => CAMPOS.every(([k, obr]) => !obr || datos[k]);
const guardar = () => { LS.set("kz_pedido_v1", {itens, idioma, numero, obs: document.getElementById("obsGeneral").value}); if(completos()) LS.set("kz_cliente_v1", Object.assign({}, datos)); };

/* ---------- idioma ---------- */
const descEm = (p, l = idioma) => l === "pt" ? p.pt : l === "es" ? p.es : (p.en || (p.en = traduzirEN(p.pt)));
function aplicarIdioma(){
  const t = T();
  document.documentElement.lang = idioma; document.title = t.titulo;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t[el.dataset.t]; });
  document.getElementById("q").placeholder = t.buscar;
  document.getElementById("obsGeneral").placeholder = t.obsGenPh;
  CAMPOS.forEach(([k, obr]) => { document.querySelector(`label[for="d_${k}"]`).innerHTML = esc(t.campos[k]) + (obr ? " <b>*</b>" : ""); });
  if(typeof mostrarNumero === "function" && document.getElementById("numeroOC")) mostrarNumero();
  if(CAT.length){ montarCategorias(); desenhar(false); if(dlgRev.open) desenharRevisao(); if(dlgPed.open) desenharPedidos(); }
}
document.getElementById("idioma").innerHTML = Object.entries(IDIOMAS).map(([k, n]) => `<option value="${k}">${n}</option>`).join("");
document.getElementById("idioma").value = idioma;
document.getElementById("idioma").addEventListener("change", e => { idioma = e.target.value; categoria = ""; guardar(); aplicarIdioma(); });

/* ---------- dados do cliente ---------- */
document.getElementById("datos").innerHTML = CAMPOS.map(([k, obr, tipo, ops]) => `<div><label for="d_${k}"></label>${
  tipo === "select" ? `<select id="d_${k}">${ops.map(o => `<option value="${o}">${o || "—"}</option>`).join("")}</select>`
  : `<input id="d_${k}" type="${tipo || "text"}" autocomplete="${{empresa:"organization", email:"email", telefono:"tel", contacto:"name", pais:"country-name", ciudad:"address-level2", direccion:"street-address"}[k] || "off"}">`}</div>`).join("");
CAMPOS.forEach(([k]) => { const el = document.getElementById("d_" + k); el.value = datos[k] || ""; el.addEventListener("input", () => { datos[k] = el.value.trim(); el.classList.remove("falta"); guardar(); }); });
const mostrarDados = () => CAMPOS.forEach(([k]) => { const el = document.getElementById("d_" + k); el.value = datos[k] || ""; el.classList.remove("falta"); });
document.getElementById("usarDatosBox").style.display = LS.get("kz_cliente_v1", {}).empresa ? "" : "none";
document.getElementById("usarDatos").addEventListener("click", () => {
  const g = LS.get("kz_cliente_v1", {});
  CAMPOS.forEach(([k]) => { if(g[k] && !datos[k]) datos[k] = g[k]; });   // só completa o que está em branco (mantém ?cliente= e o que já foi digitado)
  mostrarDados(); guardar();
});
document.getElementById("obsGeneral").value = salvo.obs || "";
document.getElementById("obsGeneral").addEventListener("input", guardar);
if(window.LOGO_KAPAZI) document.getElementById("logo").src = window.LOGO_KAPAZI; else document.getElementById("logo").remove();

/* ---------- catálogo ---------- */
function aviso(msg){ const a = document.getElementById("aviso"); a.innerHTML = msg; a.style.display = msg ? "" : "none"; }
async function lerJson(url){ const r = await fetch(url, {cache: "no-cache"}); if(!r.ok) throw new Error(url + ": HTTP " + r.status); return r.json(); }
// produto do gerador / da tabela ATACADO -> {cod, pt, es, unidade, base} (unidade sugerida como no gerador, em espanhol)
function produto(cod, descPT, um, descES){
  const s = sugerirUnidade({um, desc: descPT || ""});
  return {cod, pt: descPT || cod, es: ((descES || traduzir(descPT || "")).trim() || cod), unidade: s.unidade, base: s.baseFator || ""};
}
async function carregarBanco(){
  const c = window.PEDIDOS_CFG;
  const r = await fetch(c.url + "/rest/v1/rpc/catalogo_pedido", {method: "POST", headers: {apikey: c.key, "Content-Type": "application/json"}, body: "{}"});
  if(!r.ok) throw new Error("HTTP " + r.status);
  return (await r.json()).filter(p => p && p.cod).map(p => ({...produto(p.cod, p.descricao, p.um, p.descricao_es), foto: p.foto_url || ""}));
}
const daCopia = p => ({cod: p.cod, pt: p.pt || p.desc, es: p.desc, unidade: p.unidade, base: p.base, foto: p.foto || ""});
async function carregarImagens(){
  const j = await lerJson("imagens.json");
  return cod => { const k = chave(cod), l = j.img[k] || j.img[k.replace(/^0+/, "")]; return l ? l.map(n => j.base + n) : []; };
}
// banco do gerador (sempre atualizado); a cópia completa as fotos e serve de reserva se o banco não responder;
// depois entram os produtos da tabela ATACADO que o gerador não tem; as fotos da planilha SKUImagens vêm primeiro
async function carregarCatalogo(){
  const [banco, copia, extra, imagens] = await Promise.allSettled([carregarBanco(), lerJson("catalogo.json"), lerJson("produtos_extra.json"), carregarImagens()]);
  const cop = copia.status === "fulfilled" ? copia.value.produtos.map(daCopia) : [];
  const fotoCop = new Map(cop.map(p => [p.cod, p.foto])), imgs = imagens.value || (() => []);
  let l;
  if(banco.status === "fulfilled" && banco.value.length) l = banco.value.map(p => p.foto ? p : {...p, foto: fotoCop.get(p.cod) || ""});
  else if(cop.length) l = cop;
  else if(extra.status !== "fulfilled") throw banco.reason;
  else l = [];
  const vistos = new Set();
  l = l.filter(p => !vistos.has(chave(p.cod)) && vistos.add(chave(p.cod)));
  const st = {"LANÇAMENTO": "novo", "SAINDO DE LINHA": "sai"};
  (extra.value || []).forEach(p => { if(vistos.has(chave(p.cod))) return; vistos.add(chave(p.cod)); l.push({...produto(p.cod, p.descricao, p.um), foto: "", status: st[p.status] || "", extra: true}); });
  return l.map(p => { const fs = imgs(p.cod); return fs.length ? {...p, foto: fs[0], fotos: fs} : {...p, fotos: p.foto ? [p.foto] : []}; });
}
function prepararCatalogo(lista){

const catDe = p => (descEm(p).match(/^[^\s\d(]+(\s+(DE|DEL|OF)\s+[^\s\d(]+)?/) || [""])[0];
function montarCategorias(){
  const conta = {}; CAT.forEach(p => { const c = catDe(p); if(c) conta[c] = (conta[c] || 0) + 1; });
  const cats = Object.entries(conta).filter(([, n]) => n >= 5).sort((a, b) => b[1] - a[1]).slice(0, 12).map(([c]) => c);

}

function marcar(texto, q){
  const ws = norm(q).replace(/,/g, ".").split(/\s+/).filter(Boolean); if(!ws.length) return esc(texto);
  const n = norm(texto).replace(/,/g, "."), m = new Array(texto.length).fill(false);
  ws.forEach(w => { let i = n.indexOf(w); while(i >= 0){ for(let k = i; k < i + w.length; k++) m[k] = true; i = n.indexOf(w, i + w.length); } });
  let out = "", ab = false;
  for(let i = 0; i < texto.length; i++){ if(m[i] && !ab){ out += "<mark>"; ab = true; } if(!m[i] && ab){ out += "</mark>"; ab = false; } out += esc(texto[i]); }
  return out + (ab ? "</mark>" : "");
}
function filtrados(){
  const ws = norm(filtro).replace(/,/g, ".").split(/\s+/).filter(Boolean), k = chave(filtro);
  let l = CAT.filter(p => (!soloSel || itens[p.cod]) && (!categoria || catDe(p) === categoria) && (!ws.length || ws.every(w => p.busca.includes(w)) || (k.length >= 3 && p.k.includes(k))));
  if(k.length >= 3) l = l.slice().sort((a, b) => (b.k.startsWith(k) - a.k.startsWith(k)));   // código digitado vem primeiro
  return l;
}

/* ---------- subir la hoja de pedido del cliente (Excel, CSV, PDF) ---------- */
// lê o arquivo como linhas de células [{t, x}], acha os códigos Kapazi (comparando sem espaços/pontos/traços)
// e a quantidade: pela coluna cujo título parece "cantidad/qty/quantidade"; sem título, o 1º número depois do código
const chaveHoja = s => String(s == null ? "" : s).toUpperCase().replace(/[^A-Z0-9]/g, "");
async function linhasDoArquivo(f){
  const nome = f.name.toLowerCase(), buf = await f.arrayBuffer();
  if(/\.pdf$/.test(nome) || f.type === "application/pdf"){
    await carregarScript(URL_PDFJS); pdfjsLib.GlobalWorkerOptions.workerSrc = URL_PDFJS_WORKER;
    const pdf = await pdfjsLib.getDocument({data: new Uint8Array(buf)}).promise, linhas = [];
    for(let i = 1; i <= pdf.numPages; i++){
      const pg = await pdf.getPage(i), tc = await pg.getTextContent(), grupos = [];
      tc.items.filter(it => it.str && it.str.trim()).forEach(it => {
        const y = it.transform[5], x = it.transform[4];
        let g = grupos.find(g => Math.abs(g.y - y) < 3); if(!g){ g = {y, c: []}; grupos.push(g); }
        g.c.push({t: it.str.trim(), x});
      });
      grupos.sort((a, b) => b.y - a.y).forEach(g => linhas.push(g.c.sort((a, b) => a.x - b.x)));
    }
    return linhas;
  }
  await carregarScript(URL_XLSX);
  const wb = XLSX.read(buf, {type: "array"}), linhas = [];
  wb.SheetNames.forEach(n => XLSX.utils.sheet_to_json(wb.Sheets[n], {header: 1, raw: false, defval: ""})
    .forEach(l => linhas.push(l.map((t, x) => ({t: String(t).trim(), x})).filter(c => c.t))));
  return linhas;
}
function lerHoja(linhas){
  const idx = new Map(); CAT.forEach(p => idx.set(chaveHoja(p.cod), p.cod));
  const ehQtd = /^(CANT|QTY|QTD|QUANT)/;
  // "12", "2,5", "2.5", "1.500", "1.500,5", "1,500.5" -> número; qualquer outra coisa -> 0
  const num = t => { let v = String(t).replace(/\s/g, ""); if(!/^\d[\d.,]*$/.test(v)) return 0;
    if(/\./.test(v) && /,/.test(v)) v = v.lastIndexOf(",") > v.lastIndexOf(".") ? v.replace(/\./g, "").replace(",", ".") : v.replace(/,/g, "");
    else if(/,/.test(v)) v = v.replace(",", ".");
    else if(/^\d{1,3}(\.\d{3})+$/.test(v)) v = v.replace(/\./g, "");
    return lerNum(v); };
  let xQtd = null; const achados = new Map(), semCod = [];
  linhas.forEach(l => {
    const cabec = l.find(c => ehQtd.test(chaveHoja(c.t)));
    if(cabec && !l.some(c => idx.has(chaveHoja(c.t)))){ xQtd = cabec.x; return; }
    let i = l.findIndex(c => idx.has(chaveHoja(c.t))), cod = i >= 0 ? idx.get(chaveHoja(l[i].t)) : null;
    if(!cod) l.some((c, j) => c.t.split(/\s+/).some(w => idx.has(chaveHoja(w)) && (cod = idx.get(chaveHoja(w)), i = j, true)));   // código junto com a descrição
    if(!cod){ if(l.length >= 2 && l.some(c => num(c.t)) && l.some(c => /[A-Za-z]{3}/.test(c.t))) semCod.push(l.map(c => c.t).join(" · ")); return; }
    let q = 0;
    if(xQtd !== null){ const cands = l.filter((c, j) => j !== i && num(c.t)); if(cands.length){ const c = cands.reduce((a, b) => Math.abs(a.x - xQtd) <= Math.abs(b.x - xQtd) ? a : b); if(typeof xQtd !== "number" || Math.abs(c.x - xQtd) < 60) q = num(c.t); } }
    if(!q){ const c = l.slice(i + 1).find(c => num(c.t) && chaveHoja(c.t) !== chaveHoja(l[i].t)); q = c ? num(c.t) : 0; }
    const a = achados.get(cod) || {cod, qtd: 0}; a.qtd += q; achados.set(cod, a);
  });
  return {achados: [...achados.values()], semCod};
}
let hojaLida = null;
const dlgHoja = document.getElementById("dlgHoja");
document.getElementById("hojaArquivo").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if(!f) return;
  const t = T();
  if(/\.(png|jpe?g|gif|webp|heic|bmp|tiff?)$/i.test(f.name)){ alert(t.hojaImagen); return; }
  toast(t.hojaLeyendo);
  try{ hojaLida = lerHoja(await linhasDoArquivo(f)); }catch(err){ alert(t.hojaError + (err && err.message || err)); return; }
  const {achados, semCod} = hojaLida;
  document.getElementById("hojaResumo").textContent = t.hojaResumo(f.name, achados.length, achados.filter(a => !a.qtd).length);
  document.getElementById("hojaTb").innerHTML = achados.length ? achados.map(a => { const p = porCod.get(a.cod);
    return `<tr><td class="cod">${esc(a.cod)}</td><td>${esc(descEm(p))}</td><td class="n">${a.qtd ? esc(fmtQ(a.qtd)) + " " + esc(unidadeEm(p.unidade, idioma)) : `<span class="det">${esc(t.hojaSinCant)}</span>`}</td></tr>`; }).join("")
    : `<tr><td colspan="3" class="vacio">${esc(t.hojaNada)}</td></tr>`;
  document.getElementById("hojaFalta").innerHTML = semCod.length ? `<p class="ayuda" style="margin:0 0 6px">${esc(t.hojaNoEnc(semCod.length))}</p><div class="det">${semCod.slice(0, 30).map(esc).join("<br>")}${semCod.length > 30 ? "<br>…" : ""}</div>` : "";
  document.getElementById("hojaOk").disabled = !achados.some(a => a.qtd);
  dlgHoja.showModal();
});

/* ---------- PDF ---------- */
function carregarScript(src){
  return new Promise((ok, erro) => { if(document.querySelector(`script[src="${src}"]`)) return ok();
    const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => erro(new Error("no se pudo cargar " + src)); document.head.appendChild(s); });
}
const hojeISO = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
// logo (branco, para a faixa azul) reduzido em JPEG sobre o azul: o PNG original deixaria o PDF com mais de 1 MB
function logoJpeg(src){ return new Promise(ok => { const i = new Image(); i.onload = () => {
  const k = Math.min(1, 500 / i.naturalWidth), c = document.createElement("canvas"); c.width = Math.round(i.naturalWidth * k); c.height = Math.round(i.naturalHeight * k);
  const g = c.getContext("2d"); g.fillStyle = "#041243"; g.fillRect(0, 0, c.width, c.height); g.drawImage(i, 0, 0, c.width, c.height);
  ok({src: c.toDataURL("image/jpeg", .9), w: c.width, h: c.height}); }; i.onerror = () => ok(null); i.src = src; }); }
async function gerarPdf(modo){
  const f = faltando(), t = T(), tp = t.pdf;
  if(f.length){
    dlgRev.close(); f.forEach(x => document.getElementById("d_" + x.k).classList.add("falta"));
    document.getElementById("d_" + f[0].k).focus(); document.getElementById("d_" + f[0].k).scrollIntoView({block: "center"});
    return;
  }
  const sel = selecionados(); if(!sel.length) return;
  const btn = document.getElementById(modo === "baixar" ? "pdf" : modo), rotulo = btn.textContent; btn.disabled = true; btn.textContent = t.generando;
  try{
    const ped = salvarPedido(false);   // gerar o PDF também salva o pedido (e cria o nº da OC)
    await carregarScript(URL_JSPDF); await carregarScript(URL_AUTOTABLE);
    const {jsPDF} = window.jspdf, doc = new jsPDF({unit: "mm", format: "a4", compress: true});
    doc.setProperties({title: `${tp.titulo} ${numero}`, subject: "KZPED1:" + paraB64(ped), author: datos.empresa || "", creator: "Kapazi Pedidos"});
    const W = 210, M = 12, NAVY = [4, 18, 67], CORAL = [241, 106, 100], fecha = hojeISO().split("-").reverse().join("/");
    // faixa do topo: logo, título e a marca KZ-PED (o gerador reconhece a hoja de pedido por ela)
    doc.setFillColor(...NAVY); doc.rect(0, 0, W, 24, "F");
    if(window.LOGO_KAPAZI){ const d = await logoJpeg(window.LOGO_KAPAZI); if(d){ const h = 16, w = Math.min(50, h * d.w / d.h); doc.addImage(d.src, "JPEG", M, 4, w, h); } }
    doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(16); doc.text(tp.titulo, W - M, 12, {align: "right"});
    doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.text(`${t.numero}: ${numero}`, W - M, 17.5, {align: "right"});
    doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); doc.text(`${MARCA}   ${tp.fecha} ${fecha}`, W - M, 21.5, {align: "right"});
    // dados do cliente em duas colunas (rótulo e valor separados)
    doc.setTextColor(30, 32, 48);
    const pares = CAMPOS.filter(([k]) => datos[k]).map(([k]) => [t.campos[k].replace(/\s*\(.*\)$/, ""), datos[k]]);
    let y = 32;
    doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(...CORAL); doc.text(tp.cliente, M, y); y += 5;
    doc.setFontSize(8.5); doc.setTextColor(30, 32, 48);
    const col = [M, W / 2 + 2], larg = W / 2 - M - 2;
    doc.setFont("helvetica", "bold"); const dx = Math.max(20, ...pares.map(p => doc.getTextWidth(p[0] + ":"))) + 3;
    for(let i = 0; i < pares.length; i += 2){
      let alt = 0;
      [pares[i], pares[i + 1]].forEach((par, j) => { if(!par) return;
        doc.setFont("helvetica", "bold"); doc.text(par[0] + ":", col[j], y);
        doc.setFont("helvetica", "normal"); const v = doc.splitTextToSize(String(par[1]), larg - dx); doc.text(v, col[j] + dx, y); alt = Math.max(alt, v.length); });
      y += 4.6 * Math.max(1, alt);
    }
    // código, cabeçalho e quantidade nunca quebram linha: o importador acha as colunas pelo cabeçalho
    // e lê o código e a quantidade da 1ª linha de cada item
    doc.setFont("helvetica", "bold"); doc.setFontSize(8);
    const larg1 = (txts) => Math.max(...txts.map(x => doc.getTextWidth(String(x)))) + 4.5;
    const cab = tp.cab, largCod = Math.max(22, larg1([cab[1], ...sel.map(p => p.cod)])), largQtd = Math.max(18, larg1([cab[4], ...sel.map(p => fmtQ(p.qtd))]));
    const largUn = Math.max(16, larg1([cab[3], ...sel.map(p => p.un)]));
    doc.autoTable({
      startY: y + 3, margin: {left: M, right: M, bottom: 16},
      head: [cab],
      body: sel.map((p, i) => [String(i + 1), p.cod, p.desc, p.un, fmtQ(p.qtd), p.obs || ""]),
      styles: {font: "helvetica", fontSize: 8, cellPadding: 1.6, valign: "top", lineColor: [200, 202, 210], lineWidth: 0.1, textColor: [30, 32, 48]},
      headStyles: {fillColor: NAVY, textColor: 255, fontStyle: "bold", valign: "middle", overflow: "visible"},
      alternateRowStyles: {fillColor: [243, 246, 251]},
      columnStyles: {0: {cellWidth: 9, halign: "right"}, 1: {cellWidth: largCod, fontStyle: "bold", overflow: "visible"}, 2: {cellWidth: "auto"}, 3: {cellWidth: largUn},
        4: {cellWidth: largQtd, halign: "right", fontStyle: "bold", overflow: "visible"}, 5: {cellWidth: 34}},
      showHead: "everyPage"
    });
    y = doc.lastAutoTable.finalY + 6;
    const obs = document.getElementById("obsGeneral").value.trim();
    if(obs){
      const linhas = doc.splitTextToSize(obs, W - 2 * M);
      if(y + 8 + linhas.length * 4 > 280){ doc.addPage(); y = 20; }
      doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(...CORAL); doc.text(tp.obs, M, y); y += 5;
      doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(30, 32, 48); doc.text(linhas, M, y); y += linhas.length * 4;
    }
    // rodapé em todas as páginas
    const n = doc.getNumberOfPages();
    for(let i = 1; i <= n; i++){
      doc.setPage(i); doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor(107, 112, 128);
      doc.text(tp.pie(sel.length, CONTATO), M, 290);
      doc.text(tp.pag(i, n), W - M, 290, {align: "right"});
    }
    const nome = `${tp.archivo} ${numero} - ${(datos.empresa || "cliente").replace(/[\\/:*?"<>|]/g, "-").slice(0, 60)}.pdf`;
    if(modo === "ver"){   // prévia na própria página, antes de baixar
      const dv = document.getElementById("dlgVer"), fr = document.getElementById("verPdf");
      if(fr.dataset.url) URL.revokeObjectURL(fr.dataset.url);
      fr.dataset.url = URL.createObjectURL(doc.output("blob")); fr.src = fr.dataset.url;
      dv.showModal(); return;
    }
    if(modo === "imprimir"){   // abre a janela de impressão do navegador com o PDF (iframe escondido)
      imprimirBlob(doc.output("blob")); return;
    }
    doc.save(nome);
    const ok = document.getElementById("revOk"); ok.style.display = "";
    ok.innerHTML = t.listo(esc(nome), CONTATO, `mailto:${CONTATO}?subject=${encodeURIComponent(tp.asunto + " " + numero + " – " + (datos.empresa || "") + (datos.oc ? " – " + datos.oc : ""))}`);
  }catch(e){ alert(t.errorPdf + (e && e.message || e)); }
  finally{ btn.disabled = false; btn.textContent = rotulo; }
}
function imprimirBlob(blob){
  let fr = document.getElementById("printPdf");
  if(!fr){ fr = document.createElement("iframe"); fr.id = "printPdf"; fr.title = "print"; fr.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0"; document.body.appendChild(fr); }
  if(fr.dataset.url) URL.revokeObjectURL(fr.dataset.url);
  fr.dataset.url = URL.createObjectURL(blob);
  fr.onload = () => { try{ fr.contentWindow.focus(); fr.contentWindow.print(); }catch(e){ window.open(fr.dataset.url, "_blank"); } };
  fr.src = fr.dataset.url;
}
const dlgVer = document.getElementById("dlgVer");
document.getElementById("pdf").addEventListener("click", () => gerarPdf("baixar"));
document.getElementById("ver").addEventListener("click", () => gerarPdf("ver"));
document.getElementById("imprimir").addEventListener("click", () => gerarPdf("imprimir"));
document.getElementById("verImprimir").addEventListener("click", () => { const fr = document.getElementById("verPdf"); try{ fr.contentWindow.focus(); fr.contentWindow.print(); }catch(e){ window.open(fr.dataset.url, "_blank"); } });
document.getElementById("verBaixar").addEventListener("click", () => { dlgVer.close(); gerarPdf("baixar"); });

aplicarIdioma(); resumo(); mostrarNumero();
carregarCatalogo().then(l => { prepararCatalogo(l); desenhar(true); })
  .catch(e => { aviso(esc(T().errorCat) + ` <a href="mailto:${CONTATO}">${CONTATO}</a>.`); document.getElementById("lista").innerHTML = ""; console.error(e); });
</script>
